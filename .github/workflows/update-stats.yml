name: Update Tatar stats

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC (weekly)
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect traffic stats
        env:
          STATS_TOKEN: ${{ secrets.TATAR_STATS }}
        run: python collect.py

      - name: Commit updated data
        run: |
          git config user.name  "tatar-stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update stats ($(date -u +%Y-%m-%d))"
            git push
          fi

